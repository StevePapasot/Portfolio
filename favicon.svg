<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer hexagon filled with deep midnight blue -->
  <polygon
    points="50,4 93,27 93,73 50,96 7,73 7,27"
    fill="#03060f"
    stroke="#00e5ff"
    stroke-width="3"
  />
  <!-- Inner glow ring -->
  <polygon
    points="50,14 84,32 84,68 50,86 16,68 16,32"
    fill="none"
    stroke="#00e5ff"
    stroke-width="1"
    opacity="0.4"
  />
  <!-- Monogram: S·P initials in Chakra Petch style, approximated with paths -->
  <!-- "⬢" sigil: a small hexagon at center -->
  <polygon
    points="50,33 63,40.5 63,55.5 50,63 37,55.5 37,40.5"
    fill="none"
    stroke="#00e5ff"
    stroke-width="2.5"
  />
  <!-- Center dot — the "nucleus" -->
  <circle cx="50" cy="48" r="5" fill="#00e5ff" opacity="0.9"/>
  <!-- Green accent dot — bottom right corner, like the live LED -->
  <circle cx="75" cy="75" r="4" fill="#5fff9f"/>
</svg>
